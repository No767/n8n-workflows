# TYPE  DATABASE        USER              ADDRESS         METHOD

# Usage of unix socket is used for administrative work
# I.e., `docker compose exec database psql -U postgres`
local   all             postgres                          peer

# The compose healthcheck, which only reads pg_stat_database
local   postgres        postgres_monitor                  trust

# Ban any access of superusers
host    all             postgres          all             reject

# Allow n8n within internal network via db-bridge
host    n8n             n8n               samenet         scram-sha-256

# Allow borgmatic to dump n8n within internal network via db-bridge
host    n8n             borgmatic         samenet         scram-sha-256

# All other operations
host    all             all               all             reject
