worker_processes auto;

events {
}

http {
    server_tokens off;

    resolver 127.0.0.11 valid=10s;

    limit_req_zone $http_x_forwarded_for zone=webhooks:10m rate=5r/s;

    server {
        listen 443 ssl;

        ssl_certificate /etc/letsencrypt/live/n8n/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/n8n/privkey.pem;

        client_max_body_size 16m;

        location / {
            set $n8n http://n8n:5678;
            proxy_pass $n8n;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 5m;
        }
    }

    server {
        listen 8000;

        client_max_body_size 1m;

        limit_req zone=webhooks burst=10 nodelay;
        limit_req_status 429;

        location /webhook/ {
            if ($request_method != POST) {
                return 405;
            }
            set $n8n http://n8n:5678;
            proxy_pass $n8n;
        }

        location / {
            return 404;
        }
    }
}
