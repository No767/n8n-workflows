repositories:
  - path: ${BORG_REPO}
    label: borgbase

encryption_passphrase: "{credential container borgPassphrase}"
compression: zstd, 3
ssh_command: ssh -i /run/secrets/borgSshKey
archive_name_format: n8n-{now:%Y-%m-%dT%H:%M:%S}

keep_daily: 7
keep_weekly: 4
keep_monthly: 12
keep_yearly: 1

checks:
  - name: repository
    frequency: 2 weeks

postgresql_databases:
  - name: n8n
    hostname: database
    username: borgmatic
    password: "{credential container borgmaticDbPassword}"
    restore_username: n8n
    restore_password: "{credential container n8nDbPassword}"
    compression: none

healthchecks:
  ping_url: ${HEALTHCHECKS_URL}
